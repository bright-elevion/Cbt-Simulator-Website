{% extends "base.html" %}

{% block title %}Something Went Wrong | PrepCampus{% endblock %}

{% block content %}

<div class="error-page">

    <div class="error-card">

        <div class="error-icon">
            <i class="fas fa-triangle-exclamation"></i>
        </div>

        <span class="error-code">
            Error
        </span>

        <h1>Oops! Something went wrong</h1>

        <p>
            {{ message if message else "An unexpected error occurred while processing your request. Please try again." }}
        </p>

        <div class="error-actions">

            <a href="javascript:history.back()" class="secondary-btn">
                <i class="fas fa-arrow-left"></i>
                Go Back
            </a>

            <a href="{{ url_for('index') }}" class="primary-btn-error">
                <i class="fas fa-house"></i>
                Home
            </a>

        </div>

    </div>

</div>
<style>
    /*==================================================
                    ERROR PAGE
==================================================*/

.error-page{
    min-height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 20px;
}

/*=========================================
                CARD
=========================================*/

.error-card{
    width:100%;
    max-width:550px;
    background:#fff;
    border-radius:24px;
    padding:50px 40px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
    animation:fadeUp .5s ease;
}

/*=========================================
                ICON
=========================================*/

.error-icon{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    background:#fdecec;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:25px;
}

.error-icon i{
    color:#f44336;
    font-size:42px;
}

/*=========================================
                BADGE
=========================================*/

.error-code{
    display:inline-block;
    background:#E3F2FD;
    color:var(--primary);
    padding:8px 20px;
    border-radius:30px;
    font-size:.9rem;
    font-weight:600;
    margin-bottom:20px;
}

/*=========================================
                TEXT
=========================================*/

.error-card h1{
    font-size:2rem;
    margin-bottom:15px;
    color:var(--text-dark);
}

.error-card p{
    color:var(--text-gray);
    font-size:15px;
    line-height:1.7;
    margin-bottom:35px;
}

/*=========================================
                BUTTONS
=========================================*/

.error-actions{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    padding:15px 28px;
    border-radius:14px;
    font-weight:600;
    transition:.3s;
}

/* Home Button */

.primary-btn{
    color:#fff;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--accent-blue)
    );
}

.primary-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(33,150,243,.25);
}

/* Back Button */

.secondary-btn{
    background:#f5f7fa;
    color:var(--text-dark);
}

.secondary-btn:hover{
    background:#e8edf3;
    transform:translateY(-3px);
}

/*=========================================
            ANIMATION
=========================================*/

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/*=========================================
            MOBILE
=========================================*/

@media(max-width:768px){

.error-card{

padding:35px 25px;

}

.error-card h1{

font-size:1.6rem;

}

.error-icon{

width:80px;
height:80px;

}

.error-icon i{

font-size:34px;

}

.error-actions{

flex-direction:column;

}

.primary-btn,
.secondary-btn{

width:100%;

}

}
</style>
{% endblock %}
