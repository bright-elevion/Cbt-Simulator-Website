{% extends "base.html" %}

{% block title %}Login - PrepCampus{% endblock %}

{% block content %}
<div class="header university-header">
    <div class="university-info">
        <a href="{{ url_for('login') }}" class="back-button"><i class="fas fa-arrow-left"></i></a>
        <h2>Forgot password?</h2>
    </div>
</div>
<style>
    h2 {
        margin-top: 0;
        text-align: center;
        color: #fff;
    }

    p {
        text-align: center;
        color: #666;
        line-height: 1.5;
    }

    .form-group {
        margin-top: 25px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #007bff;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 13px;
        border: none;
        border-radius: 7px;
        background: #007bff;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    button:hover {
        background: #0069d9;
    }

    .flash {
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 6px;
        background: #f1f1f1;
        color: #333;
        text-align: center;
    }
</style>
<p>
    Enter the email address associated with your account.
    We'll send you a link to reset your password.
</p>

<form method="POST">

    <div class="form-group">
        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
            autocomplete="email"
        >
    </div>

    <button type="submit">
        Send Reset Link
    </button>

</form>
{% endblock %}
