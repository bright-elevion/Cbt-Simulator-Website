{% extends "base.html" %}

{% block content %}
<div class="admin-container">
    <a href="{{ url_for('admin_questions') }}" class="btn btn-secondary">← Back to Questions</a>

    <div class="form-container">

        <div class="page-header">
            <div>
                <span class="page-tag">Question Bank</span>
                <h1>Add New Question</h1>
                <p>Create a new CBT question for students.</p>
            </div>
        </div>

        <form method="POST" class="question-form">

            <div class="top-grid">

                <div class="form-group">
                    <label>Course Code</label>
                    <input
                        type="text"
                        id="course_code"
                        name="course_code"
                        placeholder="PHY101"
                        required>
                </div>

                <div class="form-group">
                    <label>Topic</label>
                    <input
                        type="text"
                        id="topic"
                        name="topic"
                        placeholder="Introduction to Physics"
                        required>
                </div>

            </div>

            <div class="form-group">
                <label>Question</label>

                <textarea
                    id="question_text"
                    name="question_text"
                    rows="5"
                    placeholder="Type your question here..."
                    required></textarea>
            </div>

            <div class="answers-section">

                <h3>Answer Options</h3>

                <div class="options-grid">

                    <div class="option-card">
                        <span>A</span>
                        <input
                            type="text"
                            id="option_a"
                            name="option_a"
                            placeholder="Option A"
                            required>
                    </div>

                    <div class="option-card">
                        <span>B</span>
                        <input
                            type="text"
                            id="option_b"
                            name="option_b"
                            placeholder="Option B"
                            required>
                    </div>

                    <div class="option-card">
                        <span>C</span>
                        <input
                            type="text"
                            id="option_c"
                            name="option_c"
                            placeholder="Option C"
                            required>
                    </div>

                    <div class="option-card">
                        <span>D</span>
                        <input
                            type="text"
                            id="option_d"
                            name="option_d"
                            placeholder="Option D"
                            required>
                    </div>

                </div>

            </div>

            <div class="form-group">
                <label>Correct Answer</label>

                <select
                    id="correct_option"
                    name="correct_option"
                    required>

                    <option value="">Choose answer...</option>
                    <option>A</option>
                    <option>B</option>
                    <option>C</option>
                    <option>D</option>

                </select>

            </div>

            <div class="form-group">

                <label>Explanation</label>

                <textarea
                    id="solution"
                    name="solution"
                    rows="5"
                    placeholder="Explain why this answer is correct..."></textarea>

            </div>

            <div class="form-actions">

                <a href="{{ url_for('admin_questions') }}" class="btn btn-light">
                    Cancel
                </a>

                <button class="btn btn-primary">
                    Save Question
                </button>

            </div>

        </form>

    </div>
</div>

<style>
    body{
    background:#f4f7fb;
}

.admin-container{

    max-width:950px;
    margin:auto;
    padding:40px 20px;

}

.page-header{

    margin-bottom:35px;

}

.page-tag{

    display:inline-block;
    background:#eef4ff;
    color:#2563eb;
    padding:6px 14px;
    border-radius:50px;
    font-size:.85rem;
    font-weight:600;
    margin-bottom:12px;

}

.page-header h1{

    margin:0;
    font-size:2rem;
    color:#111827;

}

.page-header p{

    margin-top:10px;
    color:#6b7280;

}

.form-container{

    background:#fff;
    border-radius:18px;
    padding:35px;
    box-shadow:
        0 10px 40px rgba(0,0,0,.06);

}

.question-form{

    display:flex;
    flex-direction:column;
    gap:24px;

}

.top-grid{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;

}

.form-group{

    display:flex;
    flex-direction:column;

}

.form-group label{

    margin-bottom:10px;
    font-weight:600;
    color:#374151;

}

.form-group input,
.form-group textarea,
.form-group select{

    border:1px solid #dbe3ee;
    border-radius:12px;
    padding:14px 16px;
    font-size:15px;
    transition:.25s;
    background:#fbfcfe;

}

.form-group textarea{

    resize:vertical;

}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{

    outline:none;
    border-color:#2563eb;
    background:white;
    box-shadow:
    0 0 0 4px rgba(37,99,235,.12);

}

.answers-section{

    background:#f8fafc;
    padding:24px;
    border-radius:16px;

}

.answers-section h3{

    margin-top:0;
    margin-bottom:18px;
    color:#111827;

}

.options-grid{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;

}

.option-card{

    display:flex;
    align-items:center;
    gap:15px;
    background:white;
    border:1px solid #e5e7eb;
    padding:16px;
    border-radius:14px;
    transition:.25s;

}

.option-card:hover{

    border-color:#2563eb;
    transform:translateY(-2px);

}

.option-card span{

    width:40px;
    height:40px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;

}

.option-card input{

    border:none;
    background:none;
    width:100%;
    font-size:15px;
    outline:none;

}

.form-actions{

    display:flex;
    justify-content:flex-end;
    gap:15px;
    padding-top:10px;

}

.btn{

    padding:13px 28px;
    border-radius:12px;
    font-weight:600;
    text-decoration:none;
    transition:.25s;

}

.btn-primary{

    border:none;
    background:#2563eb;
    color:white;

}

.btn-primary:hover{

    background:#1d4ed8;
    transform:translateY(-2px);

}

.btn-light{

    background:#f3f4f6;
    color:#374151;

}

.btn-light:hover{

    background:#e5e7eb;

}

.btn-secondary{

    display:inline-flex;
    align-items:center;
    gap:8px;
    background:white;
    border:1px solid #dbe3ee;
    color:#374151;
    padding:12px 18px;
    border-radius:12px;
    text-decoration:none;
    margin-bottom:20px;
    transition:.25s;

}

.btn-secondary:hover{

    background:#f8fafc;

}

@media(max-width:768px){

.top-grid,
.options-grid{

grid-template-columns:1fr;

}

.form-container{

padding:25px;

}

}
</style>
{% endblock %}
